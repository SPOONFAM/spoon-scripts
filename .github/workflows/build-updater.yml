name: Build SpoonLoader

on:
  push:
    paths:
      - "updater-plugin/**"
      - ".github/workflows/build-updater.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - name: Build updater
        run: gradle -p updater-plugin clean build
      - uses: actions/upload-artifact@v4
        with:
          name: SpoonLoader
          path: updater-plugin/build/libs/*.jar
